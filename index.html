<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
    <title>MIDI Player</title>
    </head>
  <body>
    <header class="app-header">
      <h1>CBB MIDI Player</h1>
    </header>

    <main class="app">
      <section class="selectors">
        <div class="selector">
          <label for="midiInput" class="btn">Add MIDI files</label>
          <input id="midiInput" type="file" accept=".mid,.midi,.mld,.mml,.mmi,.ms2mml,.mms" multiple hidden />
        </div>
        <div class="selector">
          <label for="sf2Input">Load custom SF2</label>
          <input id="sf2Input" type="file" accept=".sf2,.sf3" />
        </div>
        <div class="selector">
          <label for="sf2Select">Choose SF2 (from sound_data/Soundfonts/)</label>
          <select id="sf2Select">
            <option value="">— none —</option>
          </select>
          <button id="refreshSf2Btn" class="btn" title="Rescan Soundfonts">⟳</button>
        </div>
        <div class="selector">
          <button id="testBeepBtn" class="btn" title="Play a 1 s test tone">Audio Test</button>
          <button id="testChordBtn" class="btn" title="Play a short MIDI test on piano">MIDI Test</button>
          <button id="playDemoBtn" class="btn" title="Load and play the demo MIDI file">Play Demo File</button>
        </div>
      </section>

      <section class="player">
        <div class="now-playing" aria-live="polite">
          <span class="now-playing-label">Now playing:</span>
          <span class="now-playing-title" id="trackTitle">—</span>
        </div>

        <div class="transport">
          <div class="transport-buttons">
            <button id="prevBtn" title="Previous">⏮️</button>
            <button id="rewindBtn" title="Back to beginning">⏪</button>
            <button id="playPauseBtn" title="Play">▶️</button>
            <button id="stopBtn" title="Stop">⏹️</button>
            <button id="nextBtn" title="Next">⏭️</button>
          </div>

          <label class="inline" title="Autoplay next track">
            <input type="checkbox" id="autoplayToggle" checked /> Autoplay
          </label>

          <div class="loop-controls-box" title="Loop playback when a track ends">
            <label class="loop-enable-label">
              <input type="checkbox" id="loopEnableToggle" /> 🔄 Loop
            </label>
            <div id="loopModeField" class="loop-mode-field loop-mode--disabled" role="group" aria-label="Loop mode">
              <label class="loop-mode-label">
                <input type="radio" name="loopMode" id="loopModeTrack" value="track" disabled /> Track
              </label>
              <label class="loop-mode-label">
                <input type="radio" name="loopMode" id="loopModePlaylist" value="playlist" checked disabled /> Playlist
              </label>
            </div>
          </div>

          <div class="volume">
            <span>🔊</span>
            <input id="volume" type="range" />
            <span id="volumeValue" class="volume-readout">×1.00</span>
            <div class="volume-actions">
              <button type="button" id="volumeResetBtn" class="btn volume-reset-btn">Reset vol.</button>
              <span id="clipIndicator" class="clip-indicator">No clipping yet</span>
              <span class="help" title="×1 = FluidSynth's default gain (0.2), deliberately low to keep headroom when many notes play at once, so some files sound quiet.&#10;Orange/red: loud or dense files may saturate. A soft limiter prevents hard clipping but adds distortion: &quot;Mild clipping.&quot; when it starts rounding off peaks (barely audible), &quot;CLIPPING!&quot; when peaks go above −0.5 dB (audible distortion likely).">?</span>
            </div>
          </div>
        </div>

        <div class="timeline">
          <span id="currentTime">00:00</span>
          <input id="seek" type="range" min="0" max="1000" step="1" value="0" />
          <span id="totalTime">00:00</span>
        </div>

        <div class="tempo-controls" title="Scale playback speed (FluidSynth internal tempo mode)">
          <div class="tempo-row tempo-row-main">
            <label class="tempo-check-label">
              <input type="checkbox" id="midiTempoDefinedToggle" checked /> MIDI-defined tempo
            </label>
            <label class="tempo-field-label">Base BPM
              <input type="number" id="tempoBaseInput" class="tempo-input tempo-input-base" step="1" disabled />
            </label>
            <label class="tempo-field-label">Effective BPM
              <input type="text" id="tempoEffectiveInput" class="tempo-input tempo-input-effective" readonly tabindex="-1" value="—" />
            </label>
          </div>
          <div class="tempo-row tempo-row-factor">
            <div class="tempo-speed-row">
              <label class="tempo-slider-label">
                <span class="tempo-slider-heading">
                  <span class="tempo-speed-prefix">Speed ×</span>
                  <span id="tempoFactorValue" class="tempo-factor-readout">1.00</span>
                </span>
                <input type="range" id="tempoFactorSlider" disabled />
              </label>
              <button type="button" id="tempoFactorResetBtn" class="btn tempo-reset-btn" disabled>Reset</button>
            </div>
          </div>
        </div>
      </section>

      <section class="playlist">
        <h2>Playlist</h2>
        <ul id="playlist"></ul>
      </section>

      <section class="export">
        <details>
          <summary>Export audio</summary>
          <div class="export-body">
            <div class="export-row">
              <button type="button" id="exportTrackBtn" class="btn">Export current track</button>
              <button type="button" id="exportPlaylistBtn" class="btn">Export playlist as .zip</button>
            </div>
            <fieldset id="exportOptions" class="export-options">
              <div class="export-row">
                <label><input type="checkbox" id="exportApplyVolume" checked /> Apply current volume</label>
                <label><input type="checkbox" id="exportApplySpeed" checked /> Apply speed change</label>
                <label><input type="checkbox" id="exportTrimSilence" checked /> Trim silence at the end
                  <span class="help" title="Ends each file once its last note has died out (-60 dB relative to the tracks' loudest peak + 500 ms fade-out), instead of at the end of the MIDI file.&#10;Some files run on long after their last note (e.g. excerpts of a longer piece): without this, the audio would end with a long silence.">?</span></label>
              </div>
              <div class="export-row">
                <label><input type="checkbox" id="exportNormalize" /> Normalize volume
                  <span class="help" title="Sets the loudest peak to −0.5 dB, replacing the volume setting.&#10;The 0.5 dB margin absorbs the small peak overshoot that lossy encoding (MP3, Opus, Vorbis) adds, which would otherwise clip when the file is played.&#10;Per track: each file as loud as possible. On whole playlist: one gain for all files, keeping their relative loudness.">?</span></label>
                <label><input type="radio" name="exportNormalizeScope" value="track" checked /> per track</label>
                <label><input type="radio" name="exportNormalizeScope" value="playlist" /> on whole playlist</label>
              </div>
              <div class="export-row">
                <label>Format <select id="exportFormat"></select></label>
                <label>Bitrate <select id="exportQuality"></select></label>
                <label>Sample rate <select id="exportSampleRate"></select></label>
              </div>
              <div class="export-row">
                <label><input type="radio" name="exportChannels" value="1" /> Mono</label>
                <label><input type="radio" name="exportChannels" value="2" checked /> Stereo</label>
                <span class="export-separator"></span>
                <label><input type="radio" name="exportBitDepth" value="16" checked /> 16-bit</label>
                <label><input type="radio" name="exportBitDepth" value="24" /> 24-bit</label>
                <label><input type="radio" name="exportBitDepth" value="32" /> 32-bit float</label>
              </div>
            </fieldset>
            <div id="exportProgress" class="export-row" hidden>
              <progress id="exportProgressBar" max="1" value="0"></progress>
              <span id="exportProgressText"></span>
              <button type="button" id="exportCancelBtn" class="btn export-cancel-btn">Cancel</button>
            </div>
            <div id="exportLog" class="export-log" aria-live="polite"></div>
          </div>
        </details>
      </section>
    </main>

    <!-- Load app as module - Vite will bundle everything -->
    <script type="module" src="./main.js"></script>

    <footer style="text-align: center">
      Source code available on <a href="https://github.com/e-dervieux/CBB_MIDI_Player" target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
    </footer>
  </body>
</html>
